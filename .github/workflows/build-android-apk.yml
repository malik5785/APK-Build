name: Build V11 GLES2 Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 3.6.3 and Android templates
        run: |
          set -euo pipefail
          BASE=https://github.com/godotengine/godot-builds/releases/download/3.6.3-stable
          curl -fL --retry 3 "$BASE/Godot_v3.6.3-stable_linux_headless.64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 755 /tmp/godot/Godot_v3.6.3-stable_linux_headless.64 /usr/local/bin/godot3
          curl -fL --retry 3 "$BASE/Godot_v3.6.3-stable_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/templates/3.6.3.stable"
          unzip -q /tmp/templates.tpz -d /tmp/tmpl
          cp -a /tmp/tmpl/templates/. "$HOME/.local/share/godot/templates/3.6.3.stable/"
      - name: Import project and export Android APK
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" build
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Android Debug,O=Android,C=US" -noprompt
          mkdir -p v11-export
          cp game.gd main.tscn v11-export/
          cp data/city.json v11-export/city.json
          cat > v11-export/project.godot <<'EOF'
          config_version=4
          [application]
          config/name="City Freedom Makkah V11"
          run/main_scene="res://main.tscn"
          [display]
          window/size/width=640
          window/size/height=360
          [rendering]
          quality/driver/driver_name="GLES2"
          vram_compression/import_etc=true
          EOF
          cat > v11-export/export_presets.cfg <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          custom_features=""
          export_filter="all_resources"
          include_filter="*.json"
          exclude_filter=""
          export_path="../build/CityFreedom-Makkah-V11-GLES2.apk"
          script_export_mode=1
          script_encryption_key=""
          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          custom_template/use_custom_build=false
          version/code=11
          version/name="11.0"
          package/unique_name="com.cityfreedom.makkahv11gles2"
          package/name="City Freedom Makkah V11"
          package/signed=true
          keystore/debug=""
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          architectures/armeabi-v7a=true
          architectures/arm64-v8a=true
          screen/immersive_mode=true
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true
          graphics/32_bits_framebuffer=true
          graphics/opengl_debug=false
          EOF
          sed -i "s|keystore/debug=\\"\\"|keystore/debug=\\"$HOME/.android/debug.keystore\\"|" v11-export/export_presets.cfg
          godot3 --no-window --editor --path v11-export --quit
          godot3 --no-window --path v11-export --export-debug Android ../build/CityFreedom-Makkah-V11-GLES2.apk
          test -s build/CityFreedom-Makkah-V11-GLES2.apk
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: CityFreedom-Makkah-V11-GLES2-APK
          path: build/CityFreedom-Makkah-V11-GLES2.apk
          if-no-files-found: error
